<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Panel Kontrol</title>
    <link rel="icon" type="image/svg+xml" href="../asset/favicon.svg">
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <div class="logo-icon"><i class="fa-solid fa-user-shield"></i></div>
            <h2>Masuk Admin</h2>
            <p>Silakan masuk untuk mengelola toko</p>
        </div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username"><i class="fa-solid fa-user"></i> Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
            </div>
            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>
            <p id="loginError" style="display:none;color:var(--danger-color);font-size:13px;margin-bottom:14px;"></p>
            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe"> Ingat saya
                </label>
            </div>
            <button type="submit" class="btn-primary btn-block">
                <i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang
            </button>
        </form>
        <div class="login-footer">
            <a href="../index.html"><i class="fa-solid fa-arrow-left"></i> Kembali ke Toko</a>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
